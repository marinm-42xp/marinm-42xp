<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Welcome to Maria's GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b1f"/>
      <stop offset="0.55" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#dbeafe"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Courier New',monospace}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#dots)" mask="url(#dotmask)"/>

  <!-- ventana pixelada (guiño a la imagen 1) -->
  <g fill="none" stroke="#dbeafe" stroke-width="2" opacity="0.85">
    <rect x="950" y="28" width="200" height="66"/>
    <line x1="950" y1="46" x2="1150" y2="46"/>
  </g>
  <g fill="#dbeafe" opacity="0.85">
    <rect x="1118" y="34" width="8" height="6"/><rect x="1130" y="34" width="8" height="6"/><rect x="1142" y="34" width="4" height="6"/>
  </g>
  <text x="962" y="76" class="mono" font-size="13" fill="#bfdbfe">&gt; connect --human --data_</text>

  <!-- dunas -->
  <path d="M0 190 C200 150 380 205 600 178 S1000 150 1200 188 L1200 320 L0 320Z" fill="#14398a"/>
  <path d="M0 232 C250 190 450 252 700 216 S1050 200 1200 236 L1200 320 L0 320Z" fill="#0b2559"/>
  <!-- río -->
  <path d="M598 180 C575 214 705 236 645 272 S560 300 585 320 L700 320 C690 296 770 270 705 244 S650 212 620 180Z" fill="url(#river)" opacity="0.9"/>
  <path d="M0 285 C300 262 520 306 800 280 S1100 268 1200 286 L1200 320 L0 320Z" fill="#050f2b"/>

  <!-- texto -->
  <text x="600" y="112" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#eff6ff">Welcome to María's GitHub</text>
  <text x="600" y="152" text-anchor="middle" class="mono" font-size="28" fill="#93c5fd">&lt;<tspan class="blink">/</tspan>&gt;</text>
</svg>
