<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Horizontal Ambient Light Strip -->
    <linearGradient id="strip-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="blur-medium" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="name-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
    }
    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Card Background -->
  <rect x="15" y="15" width="1170" height="490" rx="24" fill="url(#bg-fill)"/>
  <rect x="15" y="15" width="1170" height="490" rx="24" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Colored Ambient Orbs (Blurred Background Atmosphere) -->
  <!-- Left Purple/Indigo Orb -->
  <circle cx="280" cy="200" r="170" fill="#581c87" opacity="0.65" filter="url(#blur-heavy)"/>
  <circle cx="240" cy="240" r="130" fill="#312e81" opacity="0.75" filter="url(#blur-heavy)"/>

  <!-- Right Teal/Cyan Orb -->
  <circle cx="940" cy="240" r="180" fill="#042f2e" opacity="0.7" filter="url(#blur-heavy)"/>
  <circle cx="960" cy="220" r="130" fill="#0d9488" opacity="0.45" filter="url(#blur-heavy)"/>

  <!-- Upper Right Pink/Magenta Accent -->
  <circle cx="780" cy="140" r="110" fill="#701a75" opacity="0.35" filter="url(#blur-heavy)"/>

  <!-- Center-left Ambient Light Strip -->
  <rect x="35" y="185" width="400" height="75" fill="url(#strip-grad)" filter="url(#blur-medium)"/>

  <!-- Sparkle dots / star specks -->
  <circle cx="95" cy="130" r="2.2" fill="#38bdf8" opacity="0.75"/>
  <circle cx="1090" cy="155" r="2.2" fill="#f472b6" opacity="0.8"/>
  <circle cx="1140" cy="275" r="1.8" fill="#94a3b8" opacity="0.55"/>
  <circle cx="75" cy="330" r="1.6" fill="#60a5fa" opacity="0.45"/>
  <circle cx="1040" cy="320" r="1.5" fill="#38bdf8" opacity="0.4"/>

  <!-- Corner Brackets -->
  <!-- Top Left Bracket (Cyan) -->
  <path d="M 68 45 L 48 45 L 48 65" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <!-- Top Right Bracket (Muted Lavender) -->
  <path d="M 1132 45 L 1152 45 L 1152 65" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>

  <!-- Subtle Center Rings / Tech Radar -->
  <circle cx="600" cy="215" r="185" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06" fill="none"/>
  <circle cx="600" cy="215" r="120" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="4 6" fill="none"/>

  <!-- ==================== CENTER CONTENT ==================== -->
  <!-- Main Name -->
  <text class="title-font" x="600" y="165" text-anchor="middle" font-size="44" fill="#ffffff" letter-spacing="8" filter="url(#name-glow)">
    MARÍA ALEJANDRA MARÍN
  </text>

  <!-- Primary Subtitle (Cyan Tracked Caps) -->
  <text class="mono-font" x="600" y="218" text-anchor="middle" font-size="14.5" font-weight="700" fill="#38bdf8" letter-spacing="6" filter="url(#subtle-glow)">
    S O F T W A R E   E N G I N E E R
  </text>

  <!-- Secondary Roles -->
  <text class="mono-font" x="600" y="268" text-anchor="middle" font-size="13" font-weight="500" fill="#cbd5e1" letter-spacing="3.5">
    DATABASE SYSTEMS  |  BACKEND ARCHITECTURE
  </text>

  <!-- Detail Focus Line -->
  <text class="mono-font" x="600" y="302" text-anchor="middle" font-size="11.5" font-weight="400" fill="#60a5fa" letter-spacing="2.5" opacity="0.85">
    DATA MODELING  •  API DESIGN  •  SYSTEM INTEGRATION
  </text>

  <!-- GitHub Subtext -->
  <text class="mono-font" x="600" y="340" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569" letter-spacing="2">
    github.com/marinm-42xp
  </text>

  <!-- ==================== TECH PILLS BAR ==================== -->
  <g transform="translate(600, 430)">
    <!-- Pill 1: JavaScript (Cyan/Sky) -->
    <g transform="translate(-490, -18)">
      <rect width="105" height="34" rx="17" fill="#090d16" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="52.5" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8">JavaScript</text>
    </g>

    <!-- Pill 2: React (Blue) -->
    <g transform="translate(-370, -18)">
      <rect width="80" height="34" rx="17" fill="#090d16" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="40" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#60a5fa">React</text>
    </g>

    <!-- Pill 3: Node.js (Pink/Purple) -->
    <g transform="translate(-275, -18)">
      <rect width="90" height="34" rx="17" fill="#090d16" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="45" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#c084fc">Node.js</text>
    </g>

    <!-- Pill 4: Express (Teal) -->
    <g transform="translate(-170, -18)">
      <rect width="90" height="34" rx="17" fill="#090d16" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="45" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#2dd4bf">Express</text>
    </g>

    <!-- Pill 5: PostgreSQL (White/Cyan Highlight) -->
    <g transform="translate(-65, -18)">
      <rect width="115" height="34" rx="17" fill="#090d16" stroke="#e2e8f0" stroke-width="1.2" stroke-opacity="0.85"/>
      <text class="mono-font" x="57.5" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">PostgreSQL</text>
    </g>

    <!-- Pill 6: PL/SQL (Rose/Pink) -->
    <g transform="translate(65, -18)">
      <rect width="90" height="34" rx="17" fill="#090d16" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="45" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#f472b6">PL/SQL</text>
    </g>

    <!-- Pill 7: Docker (Sky Blue) -->
    <g transform="translate(170, -18)">
      <rect width="85" height="34" rx="17" fill="#090d16" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="42.5" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8">Docker</text>
    </g>

    <!-- Pill 8: n8n (Purple) -->
    <g transform="translate(270, -18)">
      <rect width="75" height="34" rx="17" fill="#090d16" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="37.5" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#a855f7">n8n</text>
    </g>

    <!-- Pill 9: Git (Blue) -->
    <g transform="translate(360, -18)">
      <rect width="75" height="34" rx="17" fill="#090d16" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.7"/>
      <text class="mono-font" x="37.5" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#60a5fa">Git</text>
    </g>
  </g>
</svg>