<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" role="img" aria-label="terminal con consulta SQL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="d" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.5" fill="#60a5fa"/></pattern>
    <radialGradient id="rg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><circle cx="310" cy="230" r="85" fill="url(#rg)"/></mask>
    <style>
      .mono{font-family:'JetBrains Mono','Courier New',monospace}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
    </style>
  </defs>
  <rect x="14" y="14" width="392" height="352" rx="10" fill="#0a1226" stroke="#3b82f6" stroke-width="2"/>
  <path d="M14 24a10 10 0 0 1 10-10h372a10 10 0 0 1 10 10v22H14z" fill="#12306b"/>
  <circle cx="36" cy="30" r="5" fill="#60a5fa"/><circle cx="54" cy="30" r="5" fill="#3b82f6"/><circle cx="72" cy="30" r="5" fill="#93c5fd"/>
  <text x="210" y="35" text-anchor="middle" class="mono" font-size="12" fill="#bfdbfe">maria@ucab:~</text>

  <!-- halftone -->
  <rect x="215" y="145" width="190" height="170" fill="url(#d)" mask="url(#m)"/>

  <!-- cilindro de base de datos -->
  <g fill="none" stroke="#93c5fd" stroke-width="3">
    <ellipse cx="310" cy="195" rx="48" ry="14"/>
    <path d="M262 195v70c0 8 21 14 48 14s48-6 48-14v-70"/>
    <path d="M262 230c0 8 21 14 48 14s48-6 48-14"/>
  </g>

  <g class="mono" font-size="14">
    <text x="32" y="82" fill="#60a5fa">$ psql -d maria</text>
    <text x="32" y="112" fill="#dbeafe">SELECT passion</text>
    <text x="32" y="134" fill="#dbeafe">FROM   maria</text>
    <text x="32" y="156" fill="#dbeafe">WHERE  focus IN</text>
    <text x="32" y="178" fill="#93c5fd">  ('datos','software');</text>
    <text x="32" y="212" fill="#3b82f6">&gt; 2 rows</text>
    <text x="32" y="236" fill="#bfdbfe">  datos</text>
    <text x="32" y="256" fill="#bfdbfe">  software</text>
    <text x="32" y="300" fill="#60a5fa">$ <tspan class="blink">█</tspan></text>
  </g>
</svg>
