<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#071328"/>
      <stop offset="75%" stop-color="#0a1936"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <!-- Deep Blue Shimmer Strip -->
    <linearGradient id="strip-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur Filters -->
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>

    <filter id="blur-medium" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="glow-title" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-sub" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
    }
    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace;
    }

    /* CSS Animations for Movement */
    @keyframes floatLeftOrb {
      0%, 100% {
        transform: translate(0px, 0px) scale(1);
      }
      50% {
        transform: translate(45px, -20px) scale(1.15);
      }
    }

    @keyframes floatRightOrb {
      0%, 100% {
        transform: translate(0px, 0px) scale(1);
      }
      50% {
        transform: translate(-45px, 25px) scale(1.18);
      }
    }

    @keyframes pulseCenterGlow {
      0%, 100% {
        opacity: 0.35;
        transform: scale(1);
      }
      50% {
        opacity: 0.75;
        transform: scale(1.22);
      }
    }

    @keyframes rotateOuterRadar {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateInnerRadar {
      from {
        transform: rotate(360deg);
      }
      to {
        transform: rotate(0deg);
      }
    }

    @keyframes shimmerMove {
      0%, 100% {
        transform: translateX(-40px);
        opacity: 0.25;
      }
      50% {
        transform: translateX(40px);
        opacity: 0.55;
      }
    }

    @keyframes pulseTextGlow {
      0%, 100% {
        opacity: 0.92;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.45));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 24px rgba(96, 165, 250, 0.85));
      }
    }

    @keyframes twinkleStar {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.3);
      }
    }

    .anim-left-orb {
      animation: floatLeftOrb 9s ease-in-out infinite;
      transform-origin: 250px 180px;
    }

    .anim-right-orb {
      animation: floatRightOrb 10s ease-in-out infinite;
      transform-origin: 950px 180px;
    }

    .anim-center-glow {
      animation: pulseCenterGlow 7s ease-in-out infinite;
      transform-origin: 600px 190px;
    }

    .anim-outer-radar {
      animation: rotateOuterRadar 26s linear infinite;
      transform-origin: 600px 195px;
    }

    .anim-inner-radar {
      animation: rotateInnerRadar 18s linear infinite;
      transform-origin: 600px 195px;
    }

    .anim-shimmer {
      animation: shimmerMove 8s ease-in-out infinite;
      transform-origin: center;
    }

    .anim-title {
      animation: pulseTextGlow 5s ease-in-out infinite;
    }

    .star-1 {
      animation: twinkleStar 3.2s ease-in-out infinite;
      transform-origin: 95px 110px;
    }
    .star-2 {
      animation: twinkleStar 4.1s ease-in-out 1.2s infinite;
      transform-origin: 1100px 120px;
    }
    .star-3 {
      animation: twinkleStar 3.7s ease-in-out 0.6s infinite;
      transform-origin: 1135px 240px;
    }
    .star-4 {
      animation: twinkleStar 4.5s ease-in-out 2s infinite;
      transform-origin: 80px 260px;
    }
  </style>

  <!-- Outer Card Frame -->
  <rect x="12" y="12" width="1176" height="336" rx="20" fill="url(#bg-grad)"/>
  <rect x="12" y="12" width="1176" height="336" rx="20" fill="none" stroke="#1e3a8a" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- Animated Ambient Blue Orbs -->
  <g class="anim-left-orb">
    <circle cx="260" cy="180" r="160" fill="#1e40af" opacity="0.65" filter="url(#blur-heavy)"/>
    <circle cx="340" cy="160" r="120" fill="#2563eb" opacity="0.45" filter="url(#blur-heavy)"/>
  </g>

  <g class="anim-right-orb">
    <circle cx="940" cy="180" r="170" fill="#0284c7" opacity="0.6" filter="url(#blur-heavy)"/>
    <circle cx="860" cy="190" r="130" fill="#0369a1" opacity="0.45" filter="url(#blur-heavy)"/>
  </g>

  <g class="anim-center-glow">
    <circle cx="600" cy="195" r="180" fill="#1d4ed8" opacity="0.4" filter="url(#blur-heavy)"/>
    <circle cx="600" cy="210" r="130" fill="#38bdf8" opacity="0.25" filter="url(#blur-medium)"/>
  </g>

  <!-- Animated Ambient Light Strip across center-left -->
  <g class="anim-shimmer">
    <rect x="120" y="150" width="460" height="70" fill="url(#strip-blue)" filter="url(#blur-medium)"/>
  </g>

  <!-- Twinkling Micro Stars / Data Points -->
  <circle class="star-1" cx="95" cy="110" r="2.2" fill="#38bdf8"/>
  <circle class="star-2" cx="1100" cy="120" r="2.5" fill="#60a5fa"/>
  <circle class="star-3" cx="1135" cy="240" r="1.8" fill="#93c5fd"/>
  <circle class="star-4" cx="80" cy="260" r="1.6" fill="#38bdf8"/>

  <!-- Minimalist Sci-Fi Corner Brackets (Blue/Cyan) -->
  <path d="M 64 42 L 44 42 L 44 62" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <path d="M 1136 42 L 1156 42 L 1156 62" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

  <!-- Animated Concentric Rings / Tech Radar -->
  <g class="anim-outer-radar">
    <circle cx="600" cy="195" r="150" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="6 8" fill="none"/>
  </g>
  <g class="anim-inner-radar">
    <circle cx="600" cy="195" r="95" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.14" stroke-dasharray="4 6" fill="none"/>
  </g>
  <circle cx="600" cy="195" r="175" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.05" fill="none"/>

  <!-- ==================== CENTER CONTENT ==================== -->
  <!-- Main Name (Positioned lower and balanced) -->
  <g class="anim-title">
    <text class="title-font" x="600" y="195" text-anchor="middle" font-size="44" fill="#ffffff" letter-spacing="8" filter="url(#glow-title)">
      MARÍA ALEJANDRA MARÍN
    </text>
  </g>

  <!-- Blue Subtitle: Software Documentation Engineering -->
  <text class="mono-font" x="600" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="5" filter="url(#glow-sub)">
    S O F T W A R E   D O C U M E N T A T I O N   E N G I N E E R I N G
  </text>
</svg>