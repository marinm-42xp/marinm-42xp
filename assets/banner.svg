<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient: Deep dark navy/black -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Deep Blue Shimmer Strip -->
    <linearGradient id="strip-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur Filters for rich ambient glow -->
    <filter id="blur-heavy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>

    <filter id="blur-medium" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <style>
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
    }
    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace;
    }

    /* Dynamic, Noticeable Fluid Orb Movement */
    @keyframes floatLeftOrb {
      0% {
        transform: translate(0px, 0px) scale(1);
        opacity: 0.75;
      }
      33% {
        transform: translate(65px, -30px) scale(1.22);
        opacity: 0.95;
      }
      66% {
        transform: translate(30px, 35px) scale(0.92);
        opacity: 0.65;
      }
      100% {
        transform: translate(0px, 0px) scale(1);
        opacity: 0.75;
      }
    }

    @keyframes floatRightOrb {
      0% {
        transform: translate(0px, 0px) scale(1);
        opacity: 0.75;
      }
      33% {
        transform: translate(-70px, 35px) scale(1.25);
        opacity: 0.95;
      }
      66% {
        transform: translate(-30px, -35px) scale(0.9);
        opacity: 0.65;
      }
      100% {
        transform: translate(0px, 0px) scale(1);
        opacity: 0.75;
      }
    }

    @keyframes floatTopGlow {
      0%, 100% {
        transform: translate(0px, 0px) scale(1);
        opacity: 0.25;
      }
      50% {
        transform: translate(-30px, 20px) scale(1.3);
        opacity: 0.55;
      }
    }

    @keyframes rotateOuterRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateInnerRadar {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes shimmerMove {
      0%, 100% {
        transform: translateX(-50px);
        opacity: 0.2;
      }
      50% {
        transform: translateX(60px);
        opacity: 0.5;
      }
    }

    @keyframes twinkleStar {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.35);
      }
    }

    .anim-left-orb {
      animation: floatLeftOrb 6.5s ease-in-out infinite;
      transform-origin: 260px 180px;
    }

    .anim-right-orb {
      animation: floatRightOrb 7s ease-in-out infinite;
      transform-origin: 940px 180px;
    }

    .anim-top-glow {
      animation: floatTopGlow 8s ease-in-out infinite;
      transform-origin: 600px 70px;
    }

    .anim-outer-radar {
      animation: rotateOuterRadar 24s linear infinite;
      transform-origin: 600px 195px;
    }

    .anim-inner-radar {
      animation: rotateInnerRadar 16s linear infinite;
      transform-origin: 600px 195px;
    }

    .anim-shimmer {
      animation: shimmerMove 6.5s ease-in-out infinite;
    }

    .star-1 {
      animation: twinkleStar 2.8s ease-in-out infinite;
      transform-origin: 85px 110px;
    }
    .star-2 {
      animation: twinkleStar 3.6s ease-in-out 1s infinite;
      transform-origin: 1110px 120px;
    }
    .star-3 {
      animation: twinkleStar 3.2s ease-in-out 0.5s infinite;
      transform-origin: 1145px 240px;
    }
    .star-4 {
      animation: twinkleStar 4s ease-in-out 1.8s infinite;
      transform-origin: 75px 260px;
    }
  </style>

  <!-- Outer Card Frame -->
  <rect x="12" y="12" width="1176" height="336" rx="20" fill="url(#bg-grad)"/>
  <rect x="12" y="12" width="1176" height="336" rx="20" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Upper Ambient Glow -->
  <g class="anim-top-glow">
    <circle cx="600" cy="50" r="160" fill="#1e40af" opacity="0.3" filter="url(#blur-heavy)"/>
  </g>

  <!-- Left Ambient Blue Orbs -->
  <g class="anim-left-orb">
    <circle cx="250" cy="180" r="170" fill="#1e40af" opacity="0.75" filter="url(#blur-heavy)"/>
    <circle cx="330" cy="160" r="130" fill="#2563eb" opacity="0.6" filter="url(#blur-heavy)"/>
    <circle cx="280" cy="220" r="100" fill="#3b82f6" opacity="0.35" filter="url(#blur-medium)"/>
  </g>

  <!-- Right Ambient Blue Orbs -->
  <g class="anim-right-orb">
    <circle cx="950" cy="180" r="180" fill="#0284c7" opacity="0.75" filter="url(#blur-heavy)"/>
    <circle cx="870" cy="190" r="140" fill="#0369a1" opacity="0.6" filter="url(#blur-heavy)"/>
    <circle cx="920" cy="140" r="100" fill="#38bdf8" opacity="0.35" filter="url(#blur-medium)"/>
  </g>

  <!-- Left-Side Ambient Shimmer Strip -->
  <g class="anim-shimmer">
    <rect x="90" y="145" width="400" height="70" fill="url(#strip-blue)" filter="url(#blur-medium)"/>
  </g>

  <!-- ==================== SUBTLE WHITE TECHNICAL VECTORS ==================== -->

  <!-- 1. Top-Left: Retro Blueprint OS Executable Window (Project.exe aesthetic) -->
  <g opacity="0.28" stroke="#ffffff" fill="none" stroke-width="0.8">
    <rect x="68" y="52" width="155" height="85" rx="3"/>
    <line x1="68" y1="70" x2="223" y2="70"/>
    <text class="mono-font" x="78" y="65" font-size="7.5" fill="#ffffff" letter-spacing="1">PROJECT.EXE</text>
    <!-- Window glyph controls [_][□][X] -->
    <rect x="187" y="58" width="8" height="8"/>
    <line x1="189" y1="62" x2="193" y2="62"/>
    <rect x="199" y="58" width="8" height="8"/>
    <rect x="201" y="60" width="4" height="4"/>
    <rect x="211" y="58" width="8" height="8"/>
    <line x1="213" y1="60" x2="217" y2="64"/>
    <line x1="217" y1="60" x2="213" y2="64"/>
    <!-- Wireframe code schematic inside window -->
    <line x1="80" y1="84" x2="155" y2="84" stroke-dasharray="4 2"/>
    <line x1="80" y1="94" x2="185" y2="94" stroke-dasharray="6 3"/>
    <line x1="80" y1="104" x2="135" y2="104" stroke-dasharray="3 2"/>
    <line x1="80" y1="114" x2="170" y2="114" stroke-dasharray="5 2"/>
    <circle cx="190" cy="110" r="10" stroke-dasharray="2 3"/>
  </g>

  <!-- 2. Bottom-Right: 3D CAD Wireframe Mesh Grid (Geodesic / Wireframe Hand inspired) -->
  <g opacity="0.22" stroke="#ffffff" stroke-width="0.75" fill="none">
    <!-- Longitudinal curves -->
    <path d="M 910 235 C 970 255, 1040 255, 1125 235"/>
    <path d="M 895 258 C 965 280, 1050 280, 1135 258"/>
    <path d="M 885 282 C 960 308, 1060 308, 1142 282"/>
    <path d="M 875 308 C 955 336, 1070 336, 1150 308"/>
    <!-- Cross transversal ribs -->
    <path d="M 920 225 C 910 255, 890 285, 875 315"/>
    <path d="M 965 230 C 955 265, 940 300, 930 330"/>
    <path d="M 1015 232 C 1010 270, 1000 310, 990 338"/>
    <path d="M 1065 230 C 1070 268, 1065 308, 1055 338"/>
    <path d="M 1115 225 C 1125 255, 1130 290, 1125 330"/>
  </g>

  <!-- 3. Technical Blueprint Drafting Circles & Acoustic Arcs -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="0.6" fill="none">
    <circle cx="1035" cy="285" r="115" stroke-dasharray="3 4"/>
    <circle cx="1035" cy="285" r="155"/>
    <circle cx="1035" cy="285" r="195" opacity="0.5"/>
    <!-- Reference crosslines -->
    <line x1="915" y1="285" x2="1155" y2="285" stroke-dasharray="6 4"/>
    <line x1="1035" y1="165" x2="1035" y2="340" stroke-dasharray="6 4"/>
    <!-- Tiny Orange Technical Datum Node (from handshake reference) -->
    <circle cx="1035" cy="285" r="3.5" fill="#fb923c" stroke="#ffffff" stroke-width="0.8" opacity="0.85"/>
  </g>

  <!-- 4. Precision Crosshairs & Technical Callouts -->
  <!-- Left Side Crosshairs & Tag -->
  <path d="M 270 82 L 270 92 M 265 87 L 275 87" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <text class="mono-font" x="282" y="90" font-size="8" fill="#ffffff" opacity="0.32" letter-spacing="1">TRUST_ID//001</text>
  <line x1="223" y1="95" x2="255" y2="95" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.25"/>

  <!-- Lower Left Coordinate Markings -->
  <path d="M 85 285 L 85 295 M 80 290 L 90 290" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <text class="mono-font" x="98" y="293" font-size="7.5" fill="#ffffff" opacity="0.3" letter-spacing="1">COORD.DOC [64.2° // 128.0°]</text>
  <line x1="68" y1="305" x2="210" y2="305" stroke="#ffffff" stroke-width="0.6" opacity="0.18"/>

  <!-- Upper Right Technical Calibration Tag -->
  <path d="M 885 65 L 885 75 M 880 70 L 890 70" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <text class="mono-font" x="898" y="73" font-size="8" fill="#ffffff" opacity="0.35" letter-spacing="1">SPEC//ENG*</text>
  <circle cx="865" cy="70" r="3" stroke="#ffffff" stroke-width="0.7" opacity="0.3" fill="none"/>

  <!-- Top-Border Measurement / Calibration Ticks -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="0.75">
    <line x1="380" y1="12" x2="380" y2="18"/>
    <line x1="400" y1="12" x2="400" y2="16"/>
    <line x1="420" y1="12" x2="420" y2="18"/>
    <line x1="440" y1="12" x2="440" y2="16"/>
    <line x1="760" y1="12" x2="760" y2="16"/>
    <line x1="780" y1="12" x2="780" y2="18"/>
    <line x1="800" y1="12" x2="800" y2="16"/>
    <line x1="820" y1="12" x2="820" y2="18"/>
  </g>

  <!-- Twinkling Micro Stars -->
  <circle class="star-1" cx="85" cy="110" r="2.2" fill="#38bdf8"/>
  <circle class="star-2" cx="1110" cy="120" r="2.4" fill="#60a5fa"/>
  <circle class="star-3" cx="1145" cy="240" r="1.8" fill="#93c5fd"/>
  <circle class="star-4" cx="75" cy="260" r="1.6" fill="#38bdf8"/>

  <!-- Minimalist Sci-Fi Corner Brackets -->
  <path d="M 64 42 L 44 42 L 44 62" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <path d="M 1136 42 L 1156 42 L 1156 62" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>

  <!-- Subtle Concentric Tech Radar Rings -->
  <g class="anim-outer-radar">
    <circle cx="600" cy="195" r="145" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.1" stroke-dasharray="6 8" fill="none"/>
  </g>
  <g class="anim-inner-radar">
    <circle cx="600" cy="195" r="95" stroke="#60a5fa" stroke-width="0.7" stroke-opacity="0.11" stroke-dasharray="4 6" fill="none"/>
  </g>
  <circle cx="600" cy="195" r="170" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.05" fill="none"/>

  <!-- ==================== CENTER CONTENT ==================== -->
  <!-- Main Title: Crisp, solid white, zero blur, maximum contrast & clarity -->
  <text class="title-font" x="600" y="190" text-anchor="middle" font-size="32" fill="#ffffff" letter-spacing="4">
    WELCOME TO MARÍA MARÍN'S GITHUB
  </text>

  <!-- Clean Blue Subtitle: Crisp sky-blue, perfectly sharp -->
  <text class="mono-font" x="600" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="4">
    SOFTWARE DOCUMENTATION ENGINEERING
  </text>
</svg>